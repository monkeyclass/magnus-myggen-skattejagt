# Builds the Onion OS app for the Miyoo Mini (ScummVM with the ivanoff engine).
# Every push and pull request uploads the zip as a workflow artifact. A pushed
# tag v*, or "Run workflow" with a release tag, also publishes it as a GitHub
# release (the tag is created at the built commit).
name: Miyoo Mini build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v0.1.0); empty = build only'
        required: false
        default: ''

env:
  # The ScummVM commit the engine was tested with (master, 2026-10-10).
  SCUMMVM_REF: 133399506c5609ae6ff33f3ab0b9b1aaf530c010
  TOOLCHAIN_URL: https://github.com/shauninman/miyoomini-toolchain-buildroot/releases/download/v0.0.3/miyoomini-toolchain.tar.xz

jobs:
  miyoo:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Miyoo Mini toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /opt/miyoomini-toolchain
          key: miyoomini-toolchain-v0.0.3

      - name: Install the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: curl -sSL "$TOOLCHAIN_URL" | sudo tar -C /opt -xJ

      - name: Get ScummVM
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: ${{ env.SCUMMVM_REF }}
          path: scummvm-src
          fetch-depth: 1

      - name: Show versions
        run: |
          git -C scummvm-src log -1 --oneline
          ls /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-g++

      - name: Build
        run: |
          if ! miyoo/build.sh scummvm-src dist > build.log 2>&1; then
            # The end of the log as an annotation, readable without the log archive.
            msg=$(grep -E "error|Error|ERROR|not found|No such" build.log | tail -15; echo ---; tail -15 build.log)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=Build failed::$msg"
            exit 1
          fi
          tail -3 build.log

      - name: Zip
        run: |
          cd dist
          zip -qr ../MagnusMyggen2-OnionOS.zip App
          cd ..
          unzip -l MagnusMyggen2-OnionOS.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: MagnusMyggen2-OnionOS
          path: MagnusMyggen2-OnionOS.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: MagnusMyggen2-OnionOS.zip
          body_path: miyoo/RELEASE.md
